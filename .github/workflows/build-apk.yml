name: Build APK
on:
  workflow_dispatch:
    inputs:
      siteUrl:
        description: "رابط موقعك على Netlify (مثال https://name.netlify.app)"
        required: true
        type: string
      versionCode:
        description: "رقم الإصدار: 1 ثم 2 ثم 3 ... (يجب أن يزيد في كل بناء جديد)"
        required: true
        default: "5"
        type: string
      versionName:
        description: "اسم الإصدار (مثل 1.0.0)"
        required: true
        default: "1.8.7"
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SITE_URL: ${{ inputs.siteUrl }}
      VERSION_CODE: ${{ inputs.versionCode }}
      VERSION_NAME: ${{ inputs.versionName }}
      KS_PASS: "pSq5PXwPissRV9SNCwGm"
      KS_ALIAS: markaz
      KS_B64: ""
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Create project files
        run: |
          mkdir -p www scripts
          cat > package.json <<'PKG_EOF'
          {"name":"markaz-tahfeez-apk","version":"1.0.0","private":true,"dependencies":{"@capacitor/android":"^6.2.0","@capacitor/app":"^6.0.0","@capacitor/browser":"^6.0.0","@capacitor/cli":"^6.2.0","@capacitor/core":"^6.2.0","@capacitor/filesystem":"^6.0.0","@capacitor/local-notifications":"^6.1.0","@capacitor/share":"^6.0.0"},"devDependencies":{"@capacitor/assets":"^3.0.5"}}
          PKG_EOF
          cat > www/index.html <<'HTML_EOF'
          <!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مركز التحفيظ</title></head><body style="font-family:sans-serif;text-align:center;padding:48px 20px;background:#0f3d3e;color:#f5ecd2"><h2>مركز التحفيظ</h2><p>تعذر الاتصال بالخادم. تحقق من الإنترنت ثم أعد فتح التطبيق.</p></body></html>
          HTML_EOF
          cat > scripts/prepare.js <<'JS_EOF'
          const fs = require('fs');
          const E = process.env, step = process.argv[2];
          const siteUrl = (E.SITE_URL || '').trim().replace(/\/$/, '');
          if (step === 'config') {
            if (!/^https:\/\/[^\s]+\.[^\s]+$/.test(siteUrl)) { console.error('siteUrl غير صحيح. مثال: https://name.netlify.app'); process.exit(1); }
            fs.writeFileSync('capacitor.config.json', JSON.stringify({
              appId: 'ly.markaz.tahfeez', appName: 'مركز التحفيظ', webDir: 'www', backgroundColor: '#11503f',
              server: { url: siteUrl, cleartext: false }, android: { allowMixedContent: false, backgroundColor: '#11503f' },
              plugins: { LocalNotifications: { smallIcon: 'ic_stat_notify', iconColor: '#11503f' } }
            }, null, 2));
          }
          if (step === 'android') {
            const man = 'android/app/src/main/AndroidManifest.xml';
            let m = fs.readFileSync(man, 'utf8');
            ['POST_NOTIFICATIONS', 'SCHEDULE_EXACT_ALARM', 'USE_EXACT_ALARM', 'RECEIVE_BOOT_COMPLETED', 'VIBRATE'].forEach(p => {
              if (!m.includes('android.permission.' + p)) m = m.replace('</manifest>', '    <uses-permission android:name="android.permission.' + p + '" />\n</manifest>');
            });
            fs.writeFileSync(man, m);
            const gr = 'android/app/build.gradle';
            let g = fs.readFileSync(gr, 'utf8');
            g = g.replace(/versionCode\s+\d+/, 'versionCode ' + parseInt(E.VERSION_CODE, 10)).replace(/versionName\s+"[^"]*"/, 'versionName "' + E.VERSION_NAME + '"');
            fs.writeFileSync(gr, g);
            fs.mkdirSync('android/app/src/main/res/drawable', { recursive: true });
            fs.writeFileSync('android/app/src/main/res/drawable/ic_stat_icon.xml',
              '<vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24"><path android:fillColor="#FFFFFFFF" android:pathData="M12,22c1.1,0 2,-0.9 2,-2h-4c0,1.1 0.9,2 2,2zM18,16v-5c0,-3.07 -1.63,-5.64 -4.5,-6.32V4c0,-0.83 -0.67,-1.5 -1.5,-1.5s-1.5,0.67 -1.5,1.5v0.68C7.64,5.36 6,7.92 6,11v5l-2,2v1h16v-1l-2,-2z"/></vector>');
            fs.writeFileSync('android/app/src/main/res/drawable/ic_stat_notify.png', Buffer.from('', 'base64'));
          }
          JS_EOF
          echo "$KS_B64" | base64 -d > release.keystore

      - name: Install dependencies
        run: npm install

      - name: Prepare Capacitor config
        run: node scripts/prepare.js config

      - name: Add Android platform
        run: npx cap add android

      - name: Patch Android project
        run: node scripts/prepare.js android

      - name: Native edge-to-edge and logo splash
        run: |
          pip install pillow
          R=android/app/src/main/res
          mkdir -p $R/drawable-nodpi $R/drawable-v23 $R/drawable
          python3 - <<'LOGO_EOF'
          import os, urllib.request
          from PIL import Image, ImageDraw, ImageChops
          R = 'android/app/src/main/res'
          site = os.environ['SITE_URL'].strip().rstrip('/')
          try:
              req = urllib.request.Request(site + '/icon-512.png', headers={'User-Agent': 'Mozilla/5.0'})
              open('logo_src.png', 'wb').write(urllib.request.urlopen(req, timeout=30).read())
              src = Image.open('logo_src.png').convert('RGBA')
          except Exception as e:
              print('icon download failed, using plain fallback:', e)
              src = Image.new('RGBA', (512, 512), (17, 80, 63, 255))
          L = 448
          logo = src.resize((L, L), Image.LANCZOS)
          mask = Image.new('L', (L, L), 0)
          ImageDraw.Draw(mask).rounded_rectangle([0, 0, L - 1, L - 1], radius=int(L * 30 / 112), fill=255)
          logo.putalpha(ImageChops.multiply(logo.getchannel('A'), mask))
          logo.save(R + '/drawable-nodpi/hifz_logo.png')
          C = 1152
          canvas = Image.new('RGBA', (C, C), (0, 0, 0, 0))
          canvas.paste(logo, ((C - L) // 2, (C - L) // 2), logo)
          canvas.save(R + '/drawable-nodpi/hifz_splash_icon.png')
          LOGO_EOF
          cat > $R/drawable/hifz_window_bg.xml <<'XML_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <layer-list xmlns:android="http://schemas.android.com/apk/res/android">
              <item><shape android:shape="rectangle"><solid android:color="#11503f" /></shape></item>
          </layer-list>
          XML_EOF
          cat > $R/drawable-v23/hifz_window_bg.xml <<'XML_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <layer-list xmlns:android="http://schemas.android.com/apk/res/android">
              <item><shape android:shape="rectangle"><solid android:color="#11503f" /></shape></item>
              <item android:width="112dp" android:height="112dp" android:gravity="center">
                  <bitmap android:src="@drawable/hifz_logo" android:gravity="fill" />
              </item>
          </layer-list>
          XML_EOF
          python3 - <<'STY_EOF'
          import os, re
          R = 'android/app/src/main/res'
          for f in ['values/styles.xml', 'values-night/styles.xml']:
              p = os.path.join(R, f)
              if not os.path.exists(p): continue
              t = open(p, encoding='utf-8').read()
              t = t.replace('<item name="android:windowBackground">@color/hifz_splash</item>', '<item name="android:windowBackground">@drawable/hifz_window_bg</item>')
              if 'Theme.SplashScreen' in t and 'windowSplashScreenAnimatedIcon' not in t:
                  t = re.sub(r'(<style name="AppTheme\.NoActionBarLaunch"[^>]*>)', r'\1\n        <item name="windowSplashScreenAnimatedIcon">@drawable/hifz_splash_icon</item>', t)
              open(p, 'w', encoding='utf-8').write(t)
              print(f, 'patched')
          STY_EOF
          mkdir -p android/app/src/main/java/ly/markaz/tahfeez
          cat > android/app/src/main/java/ly/markaz/tahfeez/MainActivity.java <<'JAVA_EOF'
          package ly.markaz.tahfeez;

          import android.graphics.Color;
          import android.os.Build;
          import android.os.Bundle;
          import android.view.View;
          import android.view.Window;
          import android.view.WindowManager;
          import android.webkit.JavascriptInterface;
          import androidx.core.graphics.Insets;
          import androidx.core.view.OnApplyWindowInsetsListener;
          import androidx.core.view.ViewCompat;
          import androidx.core.view.WindowCompat;
          import androidx.core.view.WindowInsetsCompat;
          import androidx.core.view.WindowInsetsControllerCompat;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
            private int sat = 0;
            private int sab = 0;

            private void applyIcons(boolean light) {
              try {
                WindowInsetsControllerCompat c = WindowCompat.getInsetsController(getWindow(), getWindow().getDecorView());
                c.setAppearanceLightStatusBars(light);
                c.setAppearanceLightNavigationBars(light);
              } catch (Exception e) {}
            }

            private void pushInsets() {
              try {
                final String js = "window.__setInsets&&window.__setInsets(" + sat + "," + sab + ")";
                getBridge().getWebView().post(new Runnable() {
                  public void run() {
                    try { getBridge().getWebView().evaluateJavascript(js, null); } catch (Exception e) {}
                  }
                });
              } catch (Exception e) {}
            }

            private void edgeToEdge() {
              try {
                final Window w = getWindow();
                WindowCompat.setDecorFitsSystemWindows(w, false);
                w.setStatusBarColor(Color.TRANSPARENT);
                w.setNavigationBarColor(Color.TRANSPARENT);
                if (Build.VERSION.SDK_INT >= 29) {
                  w.setNavigationBarContrastEnforced(false);
                  w.setStatusBarContrastEnforced(false);
                }
                if (Build.VERSION.SDK_INT >= 28) {
                  WindowManager.LayoutParams lp = w.getAttributes();
                  lp.layoutInDisplayCutoutMode = WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_SHORT_EDGES;
                  w.setAttributes(lp);
                }
                final View content = findViewById(android.R.id.content);
                ViewCompat.setOnApplyWindowInsetsListener(w.getDecorView(), new OnApplyWindowInsetsListener() {
                  @Override
                  public WindowInsetsCompat onApplyWindowInsets(View v, WindowInsetsCompat in) {
                    float d = getResources().getDisplayMetrics().density;
                    int top;
                    int bottom;
                    int kb;
                    if (Build.VERSION.SDK_INT >= 30) {
                      Insets bars = in.getInsets(WindowInsetsCompat.Type.systemBars() | WindowInsetsCompat.Type.displayCutout());
                      Insets ime = in.getInsets(WindowInsetsCompat.Type.ime());
                      boolean imeOn = in.isVisible(WindowInsetsCompat.Type.ime());
                      top = bars.top;
                      bottom = imeOn ? 0 : bars.bottom;
                      kb = imeOn ? ime.bottom : 0;
                    } else {
                      Insets st = in.getStableInsets();
                      Insets sy = in.getSystemWindowInsets();
                      top = sy.top;
                      kb = Math.max(0, sy.bottom - st.bottom);
                      bottom = kb > 0 ? 0 : st.bottom;
                    }
                    sat = Math.round(top / d);
                    sab = Math.round(bottom / d);
                    content.setPadding(0, 0, 0, kb);
                    pushInsets();
                    return WindowInsetsCompat.CONSUMED;
                  }
                });
                ViewCompat.requestApplyInsets(w.getDecorView());
              } catch (Exception e) {}
            }

            @Override
            public void onCreate(Bundle savedInstanceState) {
              super.onCreate(savedInstanceState);
              edgeToEdge();
              applyIcons(true);
              try { getBridge().getWebView().setBackgroundColor(Color.TRANSPARENT); } catch (Exception e) {}
              try {
                getBridge().getWebView().addJavascriptInterface(new Object() {
                  @JavascriptInterface
                  public void setNav(final String hex, final boolean light) {
                    runOnUiThread(new Runnable() { public void run() { applyIcons(light); } });
                  }
                  @JavascriptInterface
                  public String getInsets() {
                    return sat + "," + sab;
                  }
                }, "HifzNative");
              } catch (Exception e) {}
            }
          }
          JAVA_EOF

      - name: Sync
        run: npx cap sync android

      - name: Build release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Align and sign
        run: |
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          APK=$(find android/app/build/outputs/apk/release -name "*.apk" | head -1)
          echo "Unsigned: $APK"
          $BT/zipalign -p -f 4 "$APK" aligned.apk
          $BT/apksigner sign --ks release.keystore --ks-pass pass:$KS_PASS --key-pass pass:$KS_PASS --ks-key-alias $KS_ALIAS --out markaz-tahfeez.apk aligned.apk
          $BT/apksigner verify --print-certs markaz-tahfeez.apk | head -3

      - uses: actions/upload-artifact@v4
        with:
          name: markaz-tahfeez-apk
          path: markaz-tahfeez.apk
          

name: Build APK
on:
  workflow_dispatch:
    inputs:
      siteUrl:
        description: "رابط موقعك على Netlify (مثال https://name.netlify.app)"
        required: true
        type: string
      versionCode:
        description: "رقم الإصدار: 1 ثم 2 ثم 3 ... (يجب أن يزيد في كل بناء جديد)"
        required: true
        default: "1"
        type: string
      versionName:
        description: "اسم الإصدار (مثل 1.0.0)"
        required: true
        default: "1.0.0"
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SITE_URL: ${{ inputs.siteUrl }}
      VERSION_CODE: ${{ inputs.versionCode }}
      VERSION_NAME: ${{ inputs.versionName }}
      KS_PASS: "pSq5PXwPissRV9SNCwGm"
      KS_ALIAS: markaz
      KS_B64: ""
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Create project files
        run: |
          mkdir -p www scripts
          cat > package.json <<'PKG_EOF'
          {"name":"markaz-tahfeez-apk","version":"1.0.0","private":true,"dependencies":{"@capacitor/android":"^6.2.0","@capacitor/app":"^6.0.0","@capacitor/browser":"^6.0.0","@capacitor/cli":"^6.2.0","@capacitor/core":"^6.2.0","@capacitor/filesystem":"^6.0.0","@capacitor/local-notifications":"^6.1.0","@capacitor/share":"^6.0.0"},"devDependencies":{"@capacitor/assets":"^3.0.5"}}
          PKG_EOF
          cat > www/index.html <<'HTML_EOF'
          <!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مركز التحفيظ</title></head><body style="font-family:sans-serif;text-align:center;padding:48px 20px;background:#0f3d3e;color:#f5ecd2"><h2>مركز التحفيظ</h2><p>تعذر الاتصال بالخادم. تحقق من الإنترنت ثم أعد فتح التطبيق.</p></body></html>
          HTML_EOF
          cat > scripts/prepare.js <<'JS_EOF'
          const fs = require('fs');
          const E = process.env, step = process.argv[2];
          const siteUrl = (E.SITE_URL || '').trim().replace(/\/$/, '');
          if (step === 'config') {
            if (!/^https:\/\/[^\s]+\.[^\s]+$/.test(siteUrl)) { console.error('siteUrl غير صحيح. مثال: https://name.netlify.app'); process.exit(1); }
            fs.writeFileSync('capacitor.config.json', JSON.stringify({
              appId: 'ly.markaz.tahfeez', appName: 'مركز التحفيظ', webDir: 'www', backgroundColor: '#f6f3ec',
              server: { url: siteUrl, cleartext: false }, android: { allowMixedContent: false, backgroundColor: '#f6f3ec' },
              plugins: { LocalNotifications: { smallIcon: 'ic_stat_notify', iconColor: '#11503f' } }
            }, null, 2));
          }
          if (step === 'android') {
            const man = 'android/app/src/main/AndroidManifest.xml';
            let m = fs.readFileSync(man, 'utf8');
            ['POST_NOTIFICATIONS', 'SCHEDULE_EXACT_ALARM', 'USE_EXACT_ALARM', 'RECEIVE_BOOT_COMPLETED', 'VIBRATE'].forEach(p => {
              if (!m.includes('android.permission.' + p)) m = m.replace('</manifest>', '    <uses-permission android:name="android.permission.' + p + '" />\n</manifest>');
            });
            fs.writeFileSync(man, m);
            const gr = 'android/app/build.gradle';
            let g = fs.readFileSync(gr, 'utf8');
            g = g.replace(/versionCode\s+\d+/, 'versionCode ' + parseInt(E.VERSION_CODE, 10)).replace(/versionName\s+"[^"]*"/, 'versionName "' + E.VERSION_NAME + '"');
            fs.writeFileSync(gr, g);
            fs.mkdirSync('android/app/src/main/res/drawable', { recursive: true });
            fs.writeFileSync('android/app/src/main/res/drawable/ic_stat_icon.xml',
              '<vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24"><path android:fillColor="#FFFFFFFF" android:pathData="M12,22c1.1,0 2,-0.9 2,-2h-4c0,1.1 0.9,2 2,2zM18,16v-5c0,-3.07 -1.63,-5.64 -4.5,-6.32V4c0,-0.83 -0.67,-1.5 -1.5,-1.5s-1.5,0.67 -1.5,1.5v0.68C7.64,5.36 6,7.92 6,11v5l-2,2v1h16v-1l-2,-2z"/></vector>');
            fs.writeFileSync('android/app/src/main/res/drawable/ic_stat_notify.png', Buffer.from('', 'base64'));
            const sty = 'android/app/src/main/res/values/styles.xml';
            if (fs.existsSync(sty)) {
              let t = fs.readFileSync(sty, 'utf8');
              t = t.replace(/(<style name="AppTheme\.NoActionBar"[^>]*>)/, '$1\n        <item name="android:navigationBarColor">#f6f3ec</item>\n        <item name="android:windowLightNavigationBar">true</item>');
              fs.writeFileSync(sty, t);
            }
            fs.mkdirSync('android/app/src/main/res/values-night', { recursive: true });
            fs.writeFileSync('android/app/src/main/res/values-night/styles.xml', '<?xml version="1.0" encoding="utf-8"?><resources><style name="AppTheme.NoActionBar" parent="Theme.AppCompat.DayNight.NoActionBar"><item name="windowActionBar">false</item><item name="windowNoTitle">true</item><item name="android:background">@null</item><item name="android:navigationBarColor">#0e1512</item></style></resources>');
          }
          JS_EOF
          cat > make_icons.py <<'PY_EOF'
          from PIL import Image, ImageDraw, ImageChops
          import os
          os.makedirs('assets', exist_ok=True)
          S = 1024
          def glyph(size, pad):
              im = Image.new('RGBA', (size, size), (0, 0, 0, 0)); d = ImageDraw.Draw(im)
              sc = (size - 2 * pad) / 1024.0
              P = lambda x, y: (pad + x * sc, pad + y * sc)
              cx, cy, r = 512, 330, 170
              a = Image.new('L', (size, size), 0); ImageDraw.Draw(a).ellipse([P(cx - r, cy - r), P(cx + r, cy + r)], fill=255)
              b = Image.new('L', (size, size), 0); ImageDraw.Draw(b).ellipse([P(cx - r + 75, cy - r - 25), P(cx + r + 75, cy + r - 25)], fill=255)
              im.paste(Image.new('RGBA', (size, size), (212, 175, 55, 255)), (0, 0), ImageChops.subtract(a, b))
              cream = (245, 236, 210, 255)
              d.polygon([P(512, 600), P(512, 820), P(250, 770), P(250, 560)], fill=cream)
              d.polygon([P(512, 600), P(512, 820), P(774, 770), P(774, 560)], fill=cream)
              d.line([P(512, 600), P(512, 820)], fill=(15, 61, 62, 255), width=max(2, int(10 * sc)))
              for k in range(3):
                  y0 = 630 + k * 40
                  d.line([P(290, y0 - 8 + k * 6), P(480, y0 + 22 + k * 6)], fill=(15, 61, 62, 160), width=max(1, int(6 * sc)))
                  d.line([P(734, y0 - 8 + k * 6), P(544, y0 + 22 + k * 6)], fill=(15, 61, 62, 160), width=max(1, int(6 * sc)))
              return im
          bg = (15, 61, 62, 255)
          full = Image.new('RGBA', (S, S), bg); full.alpha_composite(glyph(S, 60)); full.save('assets/icon-only.png')
          Image.new('RGBA', (S, S), bg).save('assets/icon-background.png')
          glyph(S, 200).save('assets/icon-foreground.png')
          PY_EOF
          echo "$KS_B64" | base64 -d > release.keystore

      - name: Install dependencies
        run: npm install

      - name: Prepare Capacitor config
        run: node scripts/prepare.js config

      - name: Add Android platform
        run: npx cap add android

      - name: Patch Android project
        run: node scripts/prepare.js android

      - name: Generate icons
        continue-on-error: true
        run: |
          pip install pillow
          python3 make_icons.py
          npx capacitor-assets generate --android --iconBackgroundColor '#0f3d3e' --iconBackgroundColorDark '#0f3d3e'

      - name: Sync
        run: npx cap sync android

      - name: Build release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Align and sign
        run: |
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          APK=$(find android/app/build/outputs/apk/release -name "*.apk" | head -1)
          echo "Unsigned: $APK"
          $BT/zipalign -p -f 4 "$APK" aligned.apk
          $BT/apksigner sign --ks release.keystore --ks-pass pass:$KS_PASS --key-pass pass:$KS_PASS --ks-key-alias $KS_ALIAS --out markaz-tahfeez.apk aligned.apk
          $BT/apksigner verify --print-certs markaz-tahfeez.apk | head -3

      - uses: actions/upload-artifact@v4
        with:
          name: markaz-tahfeez-apk
          path: markaz-tahfeez.apk

          

name: Build APK
on:
  workflow_dispatch:
    inputs:
      siteUrl:
        description: "رابط موقعك على Cloudflare Pages (مثال https://name.pages.dev)"
        required: true
        type: string
      versionName:
        description: "للتجربة فقط: رقم إصدار يدوي (اتركه فارغاً ليؤخذ من version.json)"
        required: false
        default: ""
        type: string

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      SITE_URL: ${{ inputs.siteUrl }}
      V_OVR: ${{ inputs.versionName }}
      PIP_BREAK_SYSTEM_PACKAGES: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      KS_PASS: "pSq5PXwPissRV9SNCwGm"
      KS_ALIAS: markaz
      KS_B64: ""
    steps:
      - name: Normalize site URL
        run: |
          U="$(echo "$SITE_URL" | xargs)"
          U="${U%/}"
          case "$U" in http://*|https://*) ;; *) U="https://$U" ;; esac
          echo "SITE_URL=$U" >> "$GITHUB_ENV"
          echo "Site URL: $U"
      - name: Read version from site (APK = app version)
        run: |
          V="$(curl -fsSL "$SITE_URL/version.json?t=$(date +%s)" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{console.log(String(JSON.parse(s).version||""))}catch(e){}})')"
          [ -n "$V_OVR" ] && V="$V_OVR"
          case "$V" in [0-9]*.[0-9]*.[0-9]*) ;; *) echo "::error::تعذر قراءة version من الموقع"; exit 1 ;; esac
          IFS=. read MA MI PA <<< "$V"
          CODE=$((MA*10000 + MI*100 + PA))
          echo "VERSION_NAME=$V" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$CODE" >> "$GITHUB_ENV"
          echo "APK version: $V (code $CODE)"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Unpack build kit
        run: |
          base64 -d <<'KIT_EOF' | tar xJ || { echo "::error::ملف الـ workflow ناقص أو مقطوع عند النسخ. ارفعه كملف وليس لصقاً."; exit 1; }

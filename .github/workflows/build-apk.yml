      - name: Create project files
        run: bash kit/create.sh

      - name: Install dependencies
        run: npm install

      - name: Prepare Capacitor config
        run: node scripts/prepare.js config

      - name: Add Android platform
        run: npx cap add android

      - name: Patch Android project
        run: node scripts/prepare.js android

      - name: Native edge-to-edge and logo splash
        run: bash kit/native.sh

      - name: Generate custom reminder sound
        run: bash kit/sound.sh

      - name: Generate icons
        continue-on-error: true
        run: |
          python3 -m pip install --quiet pillow || python3 -m pip install --quiet --break-system-packages pillow || echo "pillow install failed, using fallback"
          python3 make_icons.py
          npx capacitor-assets generate --android --iconBackgroundColor '#14624a' --iconBackgroundColorDark '#14624a'

      - name: Sync
        run: npx cap sync android

      - name: Build release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Align and sign
        run: |
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          APK=$(find android/app/build/outputs/apk/release -name "*.apk" | head -1)
          echo "Unsigned: $APK"
          $BT/zipalign -p -f 4 "$APK" aligned.apk
          $BT/apksigner sign --ks release.keystore --ks-pass pass:$KS_PASS --key-pass pass:$KS_PASS --ks-key-alias $KS_ALIAS --out markaz-tahfeez.apk aligned.apk
          $BT/apksigner verify --print-certs markaz-tahfeez.apk | head -3

      - uses: actions/upload-artifact@v4
        with:
          name: markaz-tahfeez-apk
          path: markaz-tahfeez.apk
          

name: Build APK
on:
  workflow_dispatch:
    inputs:
      siteUrl:
        description: "رابط موقعك على Netlify (مثال https://name.netlify.app)"
        required: true
        type: string
      versionCode:
        description: "رقم الإصدار: 1 ثم 2 ثم 3 ... (يجب أن يزيد في كل بناء جديد)"
        required: true
        default: "11"
        type: string
      versionName:
        description: "اسم الإصدار (مثل 1.0.0)"
        required: true
        default: "1.9.2"
        type: string

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      SITE_URL: ${{ inputs.siteUrl }}
      VERSION_CODE: ${{ inputs.versionCode }}
      VERSION_NAME: ${{ inputs.versionName }}
      PIP_BREAK_SYSTEM_PACKAGES: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      KS_PASS: "pSq5PXwPissRV9SNCwGm"
      KS_ALIAS: markaz
      KS_B64: ""
    steps:
      - name: Normalize site URL
        run: |
          U="$(echo "$SITE_URL" | xargs)"
          U="${U%/}"
          case "$U" in http://*|https://*) ;; *) U="https://$U" ;; esac
          echo "SITE_URL=$U" >> "$GITHUB_ENV"
          echo "Site URL: $U"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Unpack build kit
        run: |
          base64 -d <<'KIT_EOF' | tar xJ || { echo "::error::ملف الـ workflow ناقص أو مقطوع عند النسخ. ارفعه كملف وليس لصقاً."; exit 1; }
